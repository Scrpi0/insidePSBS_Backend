openapi: 3.0.3
info:
  title: InsidePSBS
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
paths:
  /api/register:
    post:
      summary: Register
      operationId: register
      description: "Créer un nouvel utilisateur dans la base de données de l'application et dans la base de données du BDE et envoie un mail de confirmation à l'utilisateur."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  user:
                    bde_id: 1002
                    last_name: Doe
                    first_name: Jhon
                    sector_id: 2
                    user_name: viction
                    email: viction852@glups.com
                    phone: '0601020304'
                    admission_year: 2024
                    birth_date: '2012-12-12'
                    updated_at: '2026-07-13T09:33:32.000000Z'
                    created_at: '2026-07-13T09:33:32.000000Z'
                    id: 102
                    expo_token: null
                  token: 104|qYUUkDHNYA3uAEYfFxbaib94C9E3IBV1YWPCYRck2ef8855a
                properties:
                  user:
                    type: object
                    properties:
                      bde_id:
                        type: integer
                        example: 1002
                      last_name:
                        type: string
                        example: Doe
                      first_name:
                        type: string
                        example: Jhon
                      sector_id:
                        type: integer
                        example: 2
                      user_name:
                        type: string
                        example: viction
                      email:
                        type: string
                        example: viction852@glups.com
                      phone:
                        type: string
                        example: '0601020304'
                      admission_year:
                        type: integer
                        example: 2024
                      birth_date:
                        type: string
                        example: '2012-12-12'
                      updated_at:
                        type: string
                        example: '2026-07-13T09:33:32.000000Z'
                      created_at:
                        type: string
                        example: '2026-07-13T09:33:32.000000Z'
                      id:
                        type: integer
                        example: 102
                      expo_token:
                        type: string
                        example: null
                  token:
                    type: string
                    example: 104|qYUUkDHNYA3uAEYfFxbaib94C9E3IBV1YWPCYRck2ef8855a
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_name:
                  type: string
                  description: 'Must be at least 3 characters. Must not be greater than 30 characters.'
                  example: viction
                  nullable: false
                last_name:
                  type: string
                  description: 'Must be at least 3 characters. Must not be greater than 255 characters.'
                  example: Doe
                  nullable: false
                first_name:
                  type: string
                  description: 'Must be at least 3 characters. Must not be greater than 255 characters.'
                  example: Jhon
                  nullable: false
                sector:
                  type: integer
                  description: 'See Sector for more details. The <code>id</code> of an existing record in the sectors table.'
                  example: 2
                  nullable: false
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: viction852@glups.com
                  nullable: false
                phone:
                  type: string
                  description: 'Must be at least 3 characters. Must not be greater than 10 characters.'
                  example: '0601020304'
                  nullable: false
                admission_year:
                  type: integer
                  description: 'Must be at least 2000. Must not be greater than 3000.'
                  example: 2024
                  nullable: false
                password:
                  type: string
                  description: ''
                  example: 'd"5''f4gs98d4f1"''(tg87'
                  nullable: false
                birth_date:
                  type: string
                  description: 'Must be a valid date. Must be a date before <code>today</code>.'
                  example: '2012-12-12'
                  nullable: false
                password_confirmation:
                  type: string
                  description: ''
                  example: 'd"5''f4gs98d4f1"''(tg87'
                  nullable: false
              required:
                - user_name
                - last_name
                - first_name
                - sector
                - email
                - password
      security: []
  /api/register/availability:
    get:
      summary: Availability
      operationId: availability
      description: "Verifie la disponibilité d'une donnée d'authentification"
      parameters:
        -
          in: query
          name: email
          description: ''
          example: email@email.com
          required: false
          schema:
            type: string
            description: ''
            example: email@email.com
            nullable: false
        -
          in: query
          name: user_name
          description: ''
          example: SuperUs3r
          required: false
          schema:
            type: string
            description: ''
            example: SuperUs3r
            nullable: false
        -
          in: query
          name: phone
          description: ''
          example: '0601020304'
          required: false
          schema:
            type: string
            description: ''
            example: '0601020304'
            nullable: false
      responses:
        409:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'An other user already exist with this value'
                properties:
                  message:
                    type: string
                    example: 'An other user already exist with this value'
      tags:
        - Authentification
      security: []
  /api/login:
    post:
      summary: Login
      operationId: login
      description: 'Check credentials and return an authentification Token'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                example:
                  -
                    message:
                      - 'mauvais identifiants'
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: nmraz@example.com
                  nullable: false
                password:
                  type: string
                  description: ''
                  example: V-|i$133W9
                  nullable: false
              required:
                - email
                - password
      security: []
  /api/forgot-password:
    post:
      summary: 'Reset Password'
      operationId: resetPassword
      description: 'Send a mail with a reset password link.'
      parameters: []
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Email not send'
                properties:
                  message:
                    type: string
                    example: 'Email not send'
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: lterry@example.net
                  nullable: false
              required:
                - email
      security: []
  /api/logout:
    post:
      summary: Logout
      operationId: logout
      description: 'Revoke access of the attached Bearer Token'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Successfully logged out'
                properties:
                  message:
                    type: string
                    example: 'Successfully logged out'
      tags:
        - Authentification
  /api/email/verification-notification:
    post:
      summary: 'Send Verification E-mail'
      operationId: sendVerificationEMail
      description: "Send an email verification notification to the current user's mail address, if it's not already verified."
      parameters: []
      responses:
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Email is already verified'
                properties:
                  message:
                    type: string
                    example: 'Email is already verified'
      tags:
        - Authentification
  /api/check:
    get:
      summary: Status
      operationId: status
      description: 'Check if the client is connected and have a verified email.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'You are connected and verified'
                properties:
                  message:
                    type: string
                    example: 'You are connected and verified'
      tags:
        - Authentification
      security: []
  /api/password:
    put:
      summary: 'Change Password'
      operationId: changePassword
      description: 'Handle an incoming new password request.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Password updated successfully'
                properties:
                  message:
                    type: string
                    example: 'Password updated successfully'
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                former_password:
                  type: string
                  description: ''
                  example: test
                  nullable: false
                password:
                  type: string
                  description: ''
                  example: test
                  nullable: false
                password_confirmation:
                  type: string
                  description: ''
                  example: test
                  nullable: false
              required:
                - former_password
                - password
  /api/event:
    get:
      summary: 'Event Index'
      operationId: eventIndex
      description: 'Fetch a paginated list of events (with details)'
      parameters:
        -
          in: query
          name: per_page
          description: 'Number of elements per page.'
          example: 10
          required: false
          schema:
            type: integer
            description: 'Number of elements per page.'
            example: 10
            nullable: false
        -
          in: query
          name: start_at
          description: 'Treshold for start date. start_at attribute of all returned Events will be after this one'
          example: '2020-07-08T18:24:53'
          required: false
          schema:
            type: string
            description: 'Treshold for start date. start_at attribute of all returned Events will be after this one'
            example: '2020-07-08T18:24:53'
            nullable: false
        -
          in: query
          name: organization_id
          description: ''
          example: 18
          required: false
          schema:
            type: integer
            description: ''
            example: 18
            nullable: false
        -
          in: query
          name: previous_date
          description: ''
          example: sunt
          required: false
          schema:
            type: string
            description: ''
            example: sunt
            nullable: false
        -
          in: query
          name: page
          description: 'Page number.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number.'
            example: 1
            nullable: false
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - Event
  '/api/event/{id}':
    get:
      summary: 'Event infos'
      operationId: eventInfos
      description: 'Fetch data of the specified Event'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    title: 'Quae velit at in voluptate repellendus unde.'
                    date_format:
                      start_at_simplified: '17/07 23h56'
                      end_at_simplified: '18/07 09h44'
                      date: vendredi
                      days_diff: 0
                    start_at: '2026-07-17 23:56:33'
                    end_at: '2026-07-18 09:44:16'
                    location: "568 Sanford Fall\nMoenbury, WI 09510-6663"
                    color: '#D20808'
                    author:
                      user_is_author: false
                      is_organization: true
                      id: 19
                      name: Elenor
                      short_name: eligendi
                      user_name: gerlach.hayley
                      logo_url: null
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      title:
                        type: string
                        example: 'Quae velit at in voluptate repellendus unde.'
                      date_format:
                        type: object
                        properties:
                          start_at_simplified:
                            type: string
                            example: '17/07 23h56'
                          end_at_simplified:
                            type: string
                            example: '18/07 09h44'
                          date:
                            type: string
                            example: vendredi
                          days_diff:
                            type: integer
                            example: 0
                      start_at:
                        type: string
                        example: '2026-07-17 23:56:33'
                      end_at:
                        type: string
                        example: '2026-07-18 09:44:16'
                      location:
                        type: string
                        example: "568 Sanford Fall\nMoenbury, WI 09510-6663"
                      color:
                        type: string
                        example: '#D20808'
                      author:
                        type: object
                        properties:
                          user_is_author:
                            type: boolean
                            example: false
                          is_organization:
                            type: boolean
                            example: true
                          id:
                            type: integer
                            example: 19
                          name:
                            type: string
                            example: Elenor
                          short_name:
                            type: string
                            example: eligendi
                          user_name:
                            type: string
                            example: gerlach.hayley
                          logo_url:
                            type: string
                            example: null
      tags:
        - Event
    delete:
      summary: 'Delete Event'
      operationId: deleteEvent
      description: "Remove the corresponding entry from the database, if the request is issued\nby either the original author or a member of the event's organization"
      parameters: []
      responses:
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'You are not authorized to delete this event'
                properties:
                  message:
                    type: string
                    example: 'You are not authorized to delete this event'
      tags:
        - Event
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the event.'
        example: 1
        required: true
        schema:
          type: integer
  /api/categories:
    get:
      summary: 'Category Index'
      operationId: categoryIndex
      description: 'Fetch a list of all categories'
      parameters:
        -
          in: query
          name: is_shown
          description: ''
          example: true
          required: false
          schema:
            type: boolean
            description: ''
            example: true
            nullable: false
        -
          in: query
          name: search
          description: ''
          example: admi
          required: false
          schema:
            type: string
            description: ''
            example: admi
            nullable: false
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 2
                      name: 'Admis 2023'
                      color: '#0865D2'
                      emoji: 📘
                    -
                      id: 3
                      name: 'Admis 2024'
                      color: '#0865D2'
                      emoji: 📕
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 2
                        name: 'Admis 2023'
                        color: '#0865D2'
                        emoji: 📘
                      -
                        id: 3
                        name: 'Admis 2024'
                        color: '#0865D2'
                        emoji: 📕
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 2
                        name:
                          type: string
                          example: 'Admis 2023'
                        color:
                          type: string
                          example: '#0865D2'
                        emoji:
                          type: string
                          example: 📘
      tags:
        - 'Event/Post Common'
    post:
      summary: "Define Post/Event's Categories."
      operationId: definePostEventsCategories
      description: 'Create an association between categories and an Event/Post'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Catégories associées avec succès au post.'
                  data:
                    -
                      post_id: '1'
                      event_id: null
                      category_type_id: '1'
                      id: 201
                properties:
                  message:
                    type: string
                    example: 'Catégories associées avec succès au post.'
                  data:
                    type: array
                    example:
                      -
                        post_id: '1'
                        event_id: null
                        category_type_id: '1'
                        id: 201
                    items:
                      type: object
                      properties:
                        post_id:
                          type: string
                          example: '1'
                        event_id:
                          type: string
                          example: null
                        category_type_id:
                          type: string
                          example: '1'
                        id:
                          type: integer
                          example: 201
      tags:
        - 'Event/Post Common'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                post_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the posts table.'
                  example: '1'
                  nullable: true
                event_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the events table.'
                  example: null
                  nullable: true
                category_ids:
                  type: array
                  description: 'The <code>id</code> of an existing record in the category_types table.'
                  example:
                    - '1'
                  items:
                    type: string
  /api/contents:
    post:
      summary: 'New Event/Post'
      operationId: newEventPost
      description: "Create a Post, an Event or both, and associate them together\n\nAt least one of 'create_event' or 'create_post' should be set to '1'"
      parameters: []
      responses:
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'You are not in the organization'
                properties:
                  message:
                    type: string
                    example: 'You are not in the organization'
      tags:
        - 'Event/Post Common'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: 'Required for Event. Must not be greater than 255 characters. Must be at least 3 characters.'
                  example: 'my Event !'
                  nullable: false
                body:
                  type: string
                  description: 'Required for Post. Must be at least 3 characters.'
                  example: 'Hello this is my Post linked to an Event!'
                  nullable: false
                organization_id:
                  type: integer
                  description: 'Optional for Post/Event.'
                  example: 3
                  nullable: true
                start_at:
                  type: string
                  description: 'Optional for Event. Must be a valid date.'
                  example: '2026-07-08T18:24:53'
                  nullable: false
                end_at:
                  type: string
                  description: 'Optional for Event. Must be a valid date.'
                  example: '2026-07-08T19:24:53'
                  nullable: false
                uploaded_at:
                  type: string
                  description: 'Optional for Post/Event. Must be a valid date.'
                  example: '2026-07-13T11:33:33'
                  nullable: true
                location:
                  type: string
                  description: 'Optional for Event. Must not be greater than 255 characters. Must be at least 3 characters.'
                  example: '7 golden street, Eldorado'
                  nullable: false
                create_event:
                  type: string
                  description: ''
                  example: '1'
                  nullable: false
                  enum:
                    - '0'
                    - '1'
                create_post:
                  type: string
                  description: ''
                  example: '1'
                  nullable: false
                  enum:
                    - '0'
                    - '1'
